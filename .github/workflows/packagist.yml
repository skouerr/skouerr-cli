name: Update package on Packagist

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

jobs:
  update:
    name: Notify Packagist
    runs-on: ubuntu-latest
    steps:
      # Direct API call: the token is never handed to a third-party action.
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: marcelguillaume
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            https://packagist.org/api/update-package \
            -d '{"repository":"https://packagist.org/packages/skouerr/skouerr-cli"}'
