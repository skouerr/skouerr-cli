name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none

      # Fails if composer.json, the plugin header and the tag disagree.
      - name: Check version
        id: version
        run: echo "version=$(php bin/check-version.php "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      # The archive follows .gitattributes: no tests, docs or CI files.
      - name: Build archive
        run: git archive --format=zip --prefix=skouerr-cli/ -o "skouerr-cli-${{ steps.version.outputs.version }}.zip" "$GITHUB_REF_NAME"

      - name: Release notes
        run: |
          awk -v version="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "## " version) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for ${{ steps.version.outputs.version }}"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "skouerr-cli-${{ steps.version.outputs.version }}.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
